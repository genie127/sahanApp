<style>

@keyframes drawLineReverse{
    0%{
        stroke-dashoffset: 140;
    }
    50%{
        stroke-dashoffset: 0;
    }
    100%{
        stroke-dashoffset: -140;
    }
}
@keyframes drawLine{
    0%{
        stroke-dashoffset: -140;
    }
    50%{
        stroke-dashoffset: 0;
    }
    100%{
        stroke-dashoffset: 140;
    }
}
@keyframes down{
    0%{
        top:-20px
    }
    100%{
        top: 50%;
    }
}
@keyframes left100{
    0%{
        left:50%;
        opacity:0
    }
    100%{
        left: -200%;
        opacity:1
    }
}
@keyframes left50{
    0%{
        left:50%;
        opacity:0
    }
    100%{
        left: -80%;
        opacity:1
    }
}
@keyframes right50{
    0%{
        left:50%;
        opacity:0
    }
    100%{
        left: 180%;
        opacity:1
    }
}
@keyframes right100{
    0%{
        left:50%;
        opacity:0
    }
    100%{
        left: 320%;
        opacity:1
    }
}
@keyframes opacity{
    0%{
        
        opacity:0
    }
    100%{
        opacity:1
    }
}

    .wrap{position: relative; width: 96px; margin: 0 auto; margin-top: 50px;}
    .h{width: 100%; height: auto;}
    .wave1{position: absolute; top: 50%; left: -52px; transform:translateY(-50%); width: 136px;}
    .wave2{position: absolute; top: 50%; right: -52px; transform:translateY(-50%); width: 136px;}
    .wave2 #e{stroke-dashoffset: 136; stroke-dasharray: 2;}
    

    .wave1 path{
        stroke-dasharray: 140;
        stroke-dashoffset: -140;

        animation: drawLineReverse 2s .4s linear infinite;

    }

    .wave2 path{
        stroke-dasharray: 140;
        stroke-dashoffset: -140;
        animation: drawLine 2s linear infinite;
    }

    .wave11 path{
        animation-name: drawLine ;
        animation-delay:0s
    }
    .wave12 path{
       animation-delay:.6s;
    }


    .wave21 path{
        stroke-dasharray: 140;
        stroke-dashoffset: -140;

        animation: drawLine 2s linear infinite;

    }

    .wave22 path{
        stroke-dasharray: 140;
        stroke-dashoffset: -140;
        animation: drawLineReverse 2s .4s linear infinite;
    }

    
    .forwards path{
        animation-fill-mode: forwards;
        animation-iteration-count: 1;
    }

    .star{
        position: absolute;
        top: -20px;
        left: 50%;
        transform:translate(-50%,-58%);
        width: 32px;
    }

    .forwards .star{
        animation:down 1s 2s forwards
    }
    .forwards .h2{
        position: absolute; left: 50%; transform:translateX(-50%);
        width: 100%;
        opacity:0;
    }
    .forwards .s, .forwards .a1, .forwards .a2, .forwards .n{
        position: absolute; left: 50%; transform:translateX(-50%);
        height: 100%; width: auto;
        opacity:0;
    }
    .forwards .s{animation:left100 1.2s 2.5s forwards}
    .forwards .a1{animation:left50 .8s 2.5s forwards}
    .forwards .h2{animation:opacity 1.2s 2.5s forwards}
    .forwards .a2{animation:right50 .8s 2.5s forwards}
    .forwards .n{animation:right100 1.2s 2.5s forwards}

</style>
